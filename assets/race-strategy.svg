<g font-family="monospace" font-size="12" fill="#f23b2c"><text x="49" y="192">SECTOR 01 / FIND THE LINE</text><text x="464" y="192">SECTOR 02 / BUILD THE ENGINE</text><text x="879" y="192">SECTOR 03 / TAKE ANOTHER LAP</text></g>
<g font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#efeee7"><text x="49" y="233">UNDERSTAND.</text><text x="464" y="233">ENGINEER.</text><text x="879" y="233">REFINE.</text></g>
<g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a4afb8"><text x="49" y="267">Find the actual problem.</text><text x="49" y="293">Make the next step clear.</text><text x="464" y="267">Build a useful first version.</text><text x="464" y="293">Keep the moving parts readable.</text><text x="879" y="267">Test the difficult paths.</text><text x="879" y="293">Use feedback to improve the setup.</text></g>
