<g font-family="monospace"><text x="30" y="38" font-size="12" fill="#f23b2c" letter-spacing="2">05 / RACE STRATEGY</text><text x="30" y="83" font-size="25" fill="#efeee7">THREE SECTORS. ONE BETTER BUILD.</text><text x="30" y="114" font-size="14" fill="#a4afb8">How I take an idea from the drawing board to the next version.</text></g>
