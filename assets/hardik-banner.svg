<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hardik Dhingra profile banner</title>
  <desc id="desc">A custom dark developer console banner for Hardik Dhingra.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071014"/>
      <stop offset="0.45" stop-color="#111827"/>
      <stop offset="1" stop-color="#2A1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="94" y1="52" x2="1080" y2="308" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="0.48" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="panel" x1="92" y1="84" x2="1108" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-30%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.06 0 0 0 0 0.72 0 0 0 0 0.83 0 0 0 0.45 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>

  <circle cx="1040" cy="72" r="130" fill="#A855F7" opacity="0.13" filter="url(#softGlow)"/>
  <circle cx="122" cy="296" r="140" fill="#F59E0B" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="632" cy="14" r="120" fill="#06B6D4" opacity="0.10" filter="url(#softGlow)"/>

  <rect x="70" y="58" width="1060" height="244" rx="22" fill="#030712" stroke="url(#accent)" stroke-width="2"/>
  <rect x="92" y="84" width="1016" height="196" rx="16" fill="url(#panel)" stroke="#334155" stroke-opacity="0.7"/>

  <circle cx="126" cy="114" r="7" fill="#EF4444"/>
  <circle cx="150" cy="114" r="7" fill="#F59E0B"/>
  <circle cx="174" cy="114" r="7" fill="#22C55E"/>
  <path d="M92 140H1108" stroke="#334155" stroke-opacity="0.65"/>

  <text x="126" y="177" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">hardik@github</text>
  <text x="270" y="177" fill="#22C55E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">~/ship-lab</text>
  <text x="382" y="177" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">$ build --public</text>

  <text x="126" y="225" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="0">Hardik Dhingra</text>
  <text x="130" y="258" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" letter-spacing="0">Full-stack developer shaping useful AI + Web3 products.</text>

  <g transform="translate(785 154)">
    <rect x="0" y="0" width="278" height="92" rx="16" fill="#020617" stroke="#475569"/>
    <rect x="18" y="20" width="10" height="10" rx="5" fill="#22C55E"/>
    <text x="40" y="30" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">status</text>
    <text x="116" y="30" fill="#E5E7EB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">shipping builds</text>
    <rect x="18" y="54" width="10" height="10" rx="5" fill="#F59E0B"/>
    <text x="40" y="64" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">stack</text>
    <text x="96" y="64" fill="#E5E7EB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">React / Agents / Web3</text>
  </g>

  <path d="M103 303C263 276 337 322 494 295C626 272 720 250 860 286C941 307 1016 315 1110 290" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M102 306C267 280 335 327 496 300C624 278 719 256 858 292C940 313 1020 320 1111 296" stroke="#0F172A" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
</svg>
